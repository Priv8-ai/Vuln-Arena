worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  access_log /dev/stdout;
  error_log /dev/stderr notice;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 ipv6=off valid=1s;

  map $server_port $cms_backend {
    18017 cms-wordpress:8080;
    18018 cms-shopify:8080;
    18019 cms-wix:8080;
    18020 cms-squarespace:8080;
    18021 cms-joomla:8080;
    18022 cms-tilda:8080;
    18023 cms-webflow:8080;
    18024 cms-duda:8080;
    18025 cms-godaddy:8080;
    18026 cms-drupal:8080;
    18027 cms-adobe:8080;
    18028 cms-google-sites:8080;
    18029 cms-lovable:8080;
    18030 cms-prestashop:8080;
    18031 cms-bitrix:8080;
    18032 cms-weebly:8080;
    18033 cms-typo3:8080;
    18034 cms-jimdo:8080;
    18035 cms-opencart:8080;
    18036 cms-tiendanube:8080;
    18037 cms-ghost:8080;
    18038 cms-moodle:8080;
    18039 cms-mediawiki:8080;
    18040 cms-strapi:8080;
    18041 platform-laravel:8080;
    18042 platform-django:8080;
    18043 platform-nextjs:8080;
    18044 platform-spring:8080;
  }

  server {
    listen 18017; listen 18018; listen 18019; listen 18020;
    listen 18021; listen 18022; listen 18023; listen 18024;
    listen 18025; listen 18026; listen 18027; listen 18028;
    listen 18029; listen 18030; listen 18031; listen 18032;
    listen 18033; listen 18034; listen 18035; listen 18036;
    listen 18037; listen 18038; listen 18039; listen 18040;
    listen 18041; listen 18042; listen 18043; listen 18044;

    location / {
      set $upstream "http://$cms_backend";
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $upstream;
    }
  }
}
