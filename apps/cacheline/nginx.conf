worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr info;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_cache_path /tmp/cache levels=1:2 keys_zone=edge:10m inactive=5m max_size=64m;
  proxy_http_version 1.1;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { return 200 '{"ok":true,"service":"cacheline"}\n'; add_header Content-Type application/json; }
    location /assets/ { try_files $uri =404; expires 1h; }
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Deliberately incomplete cache key for the benchmark.
    location /api/ {
      proxy_cache edge;
      proxy_cache_key "$scheme|$request_method|$host|$uri|$args";
      proxy_cache_valid 200 60s;
      proxy_ignore_headers Set-Cookie Vary;
      add_header X-Cacheline-Cache $upstream_cache_status always;
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://cacheline-origin:8080;
    }

    # Alternate route with different canonicalization behavior.
    location /edge/ {
      proxy_set_header X-Edge-Authorized $http_x_edge_authorized;
      proxy_set_header X-Original-URI $request_uri;
      rewrite ^/edge/(.*)$ /api/$1 break;
      proxy_pass http://cacheline-origin:8080;
    }
  }
}
