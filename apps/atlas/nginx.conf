worker_processes 1;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;
    location / {
      try_files $uri $uri/ =404;
    }
    location /backup/ {
      alias /usr/share/nginx/leaks/;
      autoindex on;
    }
    location /old {
      return 302 $arg_next;
    }
    location /status {
      stub_status;
    }
  }
}
