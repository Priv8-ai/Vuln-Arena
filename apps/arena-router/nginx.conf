worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr notice;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 ipv6=off valid=5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }
  include /etc/nginx/targets.map.conf;

  server {
    listen 8080 default_server;
    server_name arena.localhost arena.test localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Arena-Router dashboard always;

    location = /health {
      default_type application/json;
      return 200 '{"ok":true,"service":"arena-router","targets":44}';
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 8080;
    server_name *.arena.localhost *.arena.test;
    if ($arena_backend = "") { return 404; }
    add_header X-Arena-Router subdomain always;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 65s;
      proxy_pass http://$arena_backend;
    }
  }
}
