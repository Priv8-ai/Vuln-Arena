name: Verify benchmark

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_runtime:
        description: Build and exercise all 44 intentionally vulnerable targets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Run release gates
        run: python scripts/verify_release.py --out-dir runs/ci-static
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-release-evidence
          path: runs/ci-static/
          if-no-files-found: warn

  full-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_runtime }}
    needs: static-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Create ephemeral proof seed
        run: echo "ARENA_RUN_SEED=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build and start arena
        run: docker compose up --build -d
      - name: Wait for all targets
        run: python scripts/smoke.py --wait-seconds 120 --json-out runs/ci-runtime/readiness.json
      - name: Run full release verification
        run: python scripts/verify_release.py --runtime --out-dir runs/ci-runtime
      - name: Capture Compose state
        if: always()
        run: docker compose ps --all > runs/ci-runtime/compose-ps.txt
      - name: Stop arena
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-runtime-evidence
          path: runs/ci-runtime/
          if-no-files-found: warn
